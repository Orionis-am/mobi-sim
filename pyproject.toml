[project]
name = "mobi-sim"
version = "0.1.0"
description = "MobiSim — hybrid mobile-communications simulation platform (simulation x free APIs x evolutionary algorithms)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "gtts>=2.5",
    "pydub>=0.25",
    "pyttsx3>=2.90",
    "jiwer>=3.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "twilio>=9.11.0",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
python_files = ["test_module_*.py", "test_*.py"]
testpaths = ["module_a", "module_b", "module_c", "module_d", "module_e", "module_f"]

[tool.coverage.run]
branch = true
source = ["module_a", "module_b", "module_c", "module_d", "module_e", "module_f"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["module_a"]
