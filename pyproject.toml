[project]
name = "mobi-sim"
version = "0.1.0"
description = "MobiSim — hybrid mobile-communications simulation platform (simulation x free APIs x evolutionary algorithms)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "gtts>=2.5",
    "pydub>=0.25",
    "pyttsx3>=2.90",
    "jiwer>=3.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "twilio>=9.11.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "requests>=2.34.2",
    "folium>=0.20.0",
    "rich>=15.0.0",
    "deap>=1.4,<2.0",
    "pymoo>=0.6,<0.7",
    "pyswarm==1.0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4's bcrypt backend detection breaks on bcrypt>=4.1's removed `__about__`
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
python_files = ["test_module_*.py", "test_*.py"]
testpaths = ["module_a", "module_b", "module_c", "module_d", "module_e", "module_f"]

[tool.coverage.run]
branch = true
source = ["module_a", "module_b", "module_c", "module_d", "module_e", "module_f"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["module_a", "module_e"]
